[package]
name = "hold"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1.12.1"
prost = "0.14.4"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
tonic = "0.14.6"
tonic-prost = "0.14.6"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
crc32fast = "1.5.2"

[build-dependencies]
tonic-prost-build = "0.14.6"
